[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podcast-audio-ml"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic-settings==2.10.1",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "torch>=2.4,<3",
  "torchaudio>=2.4,<3",
  "pyannote.audio==4.0.7",
  "transformers==4.57.6",
  "sentence-transformers==5.0.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model: requires model downloads and may require a GPU",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
